name: Release

# 打 tag（v0.1.0 这种）或手动触发时，构建各平台安装包并挂到 GitHub Release。
# 版本号来自 mygo.config.ts 的 version，tag 只用来标 Release 名字，两者要对齐。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 构建 ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            platform: windows/amd64
            artifact: windows
          - name: macOS
            os: macos-latest
            platform: darwin/universal
            artifact: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 前端产物会被 mygo 嵌进二进制，所以构建安装包前先跑一次 Vite 构建。
      - name: 前端构建
        run: npm run build:web
      # 未配置签名证书，跳过签名与公证：产物能装能跑，但 Windows 首次运行会有
      # SmartScreen 提示、macOS 需要右键「打开」。要正式签名按 README「发布与签名」补配置。
      - name: 打包安装包
        run: npx mygo-cli build -platform ${{ matrix.platform }} -skip-notarize
      - name: 收集产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          # Windows 出 .exe 安装包，macOS 出 .dmg；只收这两类，避免把中间目录传上去。
          path: |
            build/**/*.exe
            build/**/*.dmg
          if-no-files-found: error

  release:
    name: 发布 Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-assets
          merge-multiple: true
      - name: 列出待发布文件
        run: ls -lh dist-assets
      - uses: softprops/action-gh-release@v2
        with:
          name: MyGo API ${{ github.ref_name }}
          # 手动触发时 ref_name 是分支名，用运行编号兜底，避免覆盖已有 tag 的 Release。
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}-build{1}', '0.1.0', github.run_number) }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## 下载

            - Windows：`mygo-api-setup-*.exe`（NSIS 安装包，装到 `%LOCALAPPDATA%\Programs\MyGoAPI`）
            - macOS：`mygo-api-*.dmg`（未签名，首次打开请右键 →「打开」）

            ## 说明

            安装包未做代码签名：Windows 首次运行会被 SmartScreen 拦一次（点「更多信息」→「仍要运行」），
            macOS 需要右键打开一次放行。数据全部保存在本机，安装包不联网。
          files: |
            dist-assets/**/*.exe
            dist-assets/**/*.dmg
