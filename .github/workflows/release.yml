name: Release

# 打 tag（v0.3.0 这种）触发发布，流程照 mygo 官方 docs/github-actions.md：
# preflight 校验版本与密钥 → 各平台 `mygo build -upload` 把安装包与签名更新文件
# 传进 Release 草稿 → publish 把草稿转正。草稿这一步由 mygo 自己做（缺 Release
# 时它会建，发布说明取自 CHANGELOG.md 的 `## <版本>` 段），所以这里不再单独建。
# 手动触发用于「重发同一版本」：填要重发的 tag，留空则用 v<mygo.config.ts 的 version>。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 要重发的 tag（如 v0.3.0）；留空则用 v<mygo.config.ts 的 version>
        required: false

permissions:
  contents: write

jobs:
  preflight:
    name: 校验版本与密钥
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        env:
          INPUT_TAG: ${{ inputs.tag }}
          UPDATER_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: |
          set -eu
          version=$(sed -n 's/^ *version: *"\([^"]*\)".*/\1/p' mygo.config.ts | head -n1)
          if [ -z "$version" ]; then echo "::error::mygo.config.ts 里读不到 version"; exit 1; fi
          tag="${INPUT_TAG:-}"
          if [ -z "$tag" ] && [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then tag="$GITHUB_REF_NAME"; fi
          if [ -z "$tag" ]; then tag="v$version"; fi
          # 产物名带的是配置里的 version，tag 只决定 Release 名字：两者不一致必然 404。
          if [ "$tag" != "v$version" ]; then
            echo "::error::tag $tag 与 mygo.config.ts 的 version $version 不一致，先跑 node scripts/bump-version.mjs $tag"
            exit 1
          fi
          # mygo 从 CHANGELOG.md 的 `## <版本>` 段取发布说明，缺了打包会失败。
          if ! grep -qE "^## ${version//./\\.}\s*$" CHANGELOG.md; then
            echo "::error::CHANGELOG.md 缺少「## $version」段落，打包取不到发布说明"
            exit 1
          fi
          # 没有私钥就签不出 update-*.json，装好的旧版本永远收不到这一版：与其发一个
          # 无法升级的 Release，不如在这里红掉（0.2 系列踩过的坑）。
          if [ -z "${UPDATER_KEY:-}" ]; then
            echo "::error::仓库 secret MYGO_UPDATER_PRIVATE_KEY 没配，构建不出签名更新文件"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    name: 构建 ${{ matrix.name }}
    needs: preflight
    strategy:
      fail-fast: false
      # 串行：两个平台都会把本平台产物的校验和并进同一个 SHA256SUMS，并行时后传的
      # 会覆盖先传的，结果可能缺行（install.ps1 就靠它校验安装包）。
      max-parallel: 1
      matrix:
        include:
          - name: Windows
            os: windows-latest
            platform: windows/amd64
          - name: macOS
            os: macos-latest
            platform: darwin/universal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # mygo build 自己会跑 buildCommand（npm run build:web），不用另跑一次。
      # 未配置签名证书，跳过签名与公证：产物能装能跑，但 Windows 首次运行会有
      # SmartScreen 提示、macOS 需要右键「打开」。要正式签名按 README 补配置。
      # -upload 把安装包、update-<os>-<arch>.json、<slug>-<版本>-<target>.tar.gz、
      # install.ps1/.sh 与 SHA256SUMS 传进 Release 草稿；缺私钥或缺 gh 认证直接报错。
      - name: 打包并上传
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx mygo-cli build -platform ${{ matrix.platform }} -skip-notarize -upload
      # 免安装版不能只发裸 exe：SQLite 原生库（mygo-sqlite3.dll）与托盘图标就在 exe
      # 旁边，单独拎出去会打不开工作区。只挑运行时文件打成 zip：安装包、install 脚本、
      # 更新清单/更新包与 SHA256SUMS 都不是用户该解压出来的东西。
      # -upload 只传安装包与更新文件，这份自己补上去。
      - name: 免安装版压缩包
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          $config = Get-Content mygo.config.ts -Raw
          $version = [regex]::Match($config, 'version:\s*"([^"]+)"').Groups[1].Value
          if (-not $version) { throw 'mygo.config.ts 里没读到 version' }
          $dir = Join-Path build 'windows-amd64'
          $stage = Join-Path $dir 'portable'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Get-ChildItem $dir -File | Where-Object {
            $_.Name -notlike '*setup*' -and
            $_.Name -ne 'install.ps1' -and $_.Name -ne 'install.sh' -and
            $_.Name -notlike 'update-*.json' -and
            $_.Extension -notin '.gz', '.zip', '.delta', '.sig'
          } | Copy-Item -Destination $stage
          $zip = "kotae-$version-portable.zip"
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -Force
          Write-Host "免安装版：$zip"
          gh release upload "$env:TAG" $zip --repo "${{ github.repository }}" --clobber

  publish:
    name: 发布 Release
    needs: [preflight, build]
    runs-on: ubuntu-latest
    steps:
      # 两个平台的资产都到齐了才转正：草稿期间装好的应用看不到这一版。
      # --latest 是必要的：配置了 tagPrefix 时 mygo 建 Release 会带 --latest=false。
      - name: 草稿转正
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.preflight.outputs.tag }}
        run: gh release edit "$TAG" --repo "${{ github.repository }}" --draft=false --latest
