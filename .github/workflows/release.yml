name: Release

# 打 tag（v0.1.0 这种）或手动触发时，构建各平台安装包并挂到 GitHub Release。
# 版本号来自 mygo.config.ts 的 version，tag 只用来标 Release 名字，两者要对齐。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 构建 ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            platform: windows/amd64
            artifact: windows
          - name: macOS
            os: macos-latest
            platform: darwin/universal
            artifact: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 前端产物会被 mygo 嵌进二进制，所以构建安装包前先跑一次 Vite 构建。
      - name: 前端构建
        run: npm run build:web
      # 未配置签名证书，跳过签名与公证：产物能装能跑，但 Windows 首次运行会有
      # SmartScreen 提示、macOS 需要右键「打开」。要正式签名按 README「发布与签名」补配置。
      # MYGO_UPDATER_PRIVATE_KEY 没配时会跳过签名更新包（构建不红），配了才会产出
      # update-<os>-<arch>.json 与 .tar.gz/.delta，自动更新才能真正生效。
      - name: 打包安装包
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: npx mygo-cli build -platform ${{ matrix.platform }} -skip-notarize
      # 裸 exe 默认叫「Kotae.exe」，上传到 Release 会被空格变成点，不好看也不好写文档；
      # 复制一份带版本号的便携版名字，和安装包一起发。
      - name: 整理便携版
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $config = Get-Content mygo.config.ts -Raw
          $version = [regex]::Match($config, 'version:\s*"([^"]+)"').Groups[1].Value
          if (-not $version) { throw 'mygo.config.ts 里没读到 version' }
          $exe = Get-ChildItem build -Recurse -Filter '*.exe' | Where-Object { $_.Name -notlike '*setup*' } | Select-Object -First 1
          if (-not $exe) { throw '没有找到可执行文件' }
          $target = Join-Path $exe.Directory "kotae-$version-portable.exe"
          Copy-Item $exe.FullName $target -Force
          Remove-Item $exe.FullName -Force
          Write-Host "便携版：$target"
      - name: 收集产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          # Windows 出 .exe 安装包，macOS 出 .dmg；只收这两类，避免把中间目录传上去。
          path: |
            build/**/*.exe
            build/**/*.dmg
            build/**/update-*.json
            build/**/*.tar.gz
            build/**/*.delta
          if-no-files-found: error

  release:
    name: 发布 Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-assets
          merge-multiple: true
      - name: 列出待发布文件
        run: ls -lh dist-assets
      # 重新发同一个 tag 时先删掉旧 Release，避免残留上一个版本命名方式的资产。
      - name: 清理同名 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v0.0.0-build{0}', github.run_number) }}"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || echo "没有同名 Release"
          git tag -d "$tag" 2>/dev/null || true
      - uses: softprops/action-gh-release@v2
        with:
          name: Kotae ${{ github.ref_name }}
          # 手动触发时 ref_name 是分支名，用运行编号兜底，避免覆盖已有 tag 的 Release。
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v0.0.0-build{0}', github.run_number) }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## 下载

            - Windows：`kotae-setup-*.exe`（NSIS 安装包，装到 `%LOCALAPPDATA%\Programs\Kotae`）、`kotae-*-portable.exe`（免安装单文件）
            - macOS：`kotae-*.dmg`（未签名，首次打开请右键 →「打开」）

            ## 说明

            安装包未做代码签名：Windows 首次运行会被 SmartScreen 拦一次（点「更多信息」→「仍要运行」），
            macOS 需要右键打开一次放行。数据全部保存在本机，安装包不联网。
          files: |
            dist-assets/**/*.exe
            dist-assets/**/*.dmg
            dist-assets/**/update-*.json
            dist-assets/**/*.tar.gz
            dist-assets/**/*.delta
